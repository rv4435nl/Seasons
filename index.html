<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vacation Survey</title>

<style>

body{
    font-family:Arial, sans-serif;
    max-width:800px;
    margin:40px auto;
    padding:20px;
    background:#f4f4f4;
}

.container{
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.15);
}

.question{
    margin-bottom:25px;
}

textarea{
    width:100%;
}

button{
    background:#0078D7;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:5px;
    cursor:pointer;
    margin-right:10px;
}

button:hover{
    background:#005ea6;
}

#results,
#analysisResults{
    display:none;
    margin-top:20px;
    padding:15px;
    border-radius:5px;
}

#results{
    background:#e8f4ff;
}

#analysisResults{
    background:#eefbea;
}

.error{
    color:red;
    font-weight:bold;
}

pre{
    white-space:pre-wrap;
    word-break:break-word;
}

</style>
</head>
<body>

<div class="container">

<h1>Vacation Survey</h1>

<form id="surveyForm">

<div class="question">

<h3>1. Which season is your favorite?</h3>

<label>
<input type="radio" name="season" value="Spring" required>
Spring
</label>
<br>

<label>
<input type="radio" name="season" value="Summer">
Summer
</label>
<br>

<label>
<input type="radio" name="season" value="Fall">
Fall
</label>
<br>

<label>
<input type="radio" name="season" value="Winter">
Winter
</label>

</div>

<div class="question">

<h3>2. What is your favorite temperature (°F)?</h3>

<input type="number" id="temperature" required>

</div>

<div class="question">

<h3>3. What is your favorite activity to do on vacation?</h3>

<textarea id="activity" rows="5" required></textarea>

</div>

<button type="submit">
Submit Survey
</button>

<button type="button" id="analysisBtn">
View Survey Analysis
</button>

</form>

<div id="results"></div>

<div id="analysisResults"></div>

</div>

<script>

const WEB_APP_URL =
"https://script.google.com/macros/s/AKfycbzEd2fQP7owvJAB8ulOAhiGhlmYWd5ILbihc0_yEbkWKcHoIFoJaGXlIOKXXQ4B8X3e/exec";


document.getElementById("surveyForm").addEventListener("submit", async function(event){

    event.preventDefault();

    const season =
        document.querySelector('input[name="season"]:checked').value;

    const temperature =
        document.getElementById("temperature").value;

    const activity =
        document.getElementById("activity").value;

    document.getElementById("results").style.display = "block";

    document.getElementById("results").innerHTML =
        "<p>Submitting survey...</p>";

    try{

        const response = await fetch(WEB_APP_URL,{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                season:season,
                temperature:temperature,
                activity:activity
            })
        });

        const responseText = await response.text();

        console.log("Server Response:");
        console.log(responseText);

        let result;

        try{
            result = JSON.parse(responseText);
        }
        catch(parseError){

            document.getElementById("results").innerHTML =
                "<h3 class='error'>Server did not return JSON.</h3>" +
                "<pre>" + responseText + "</pre>";

            return;
        }

        if(result.success === false){

            document.getElementById("results").innerHTML =
                "<h3 class='error'>Apps Script Error</h3>" +
                "<pre>" + result.error + "</pre>";

            return;
        }

        document.getElementById("results").innerHTML =

            "<h2>Survey Submitted</h2>" +

            "<p><b>Favorite Season:</b> "
            + season + "</p>" +

            "<p><b>Favorite Temperature:</b> "
            + temperature + "°F</p>" +

            "<p><b>Vacation Activity:</b> "
            + activity + "</p>" +

            "<hr>" +

            "<p><b>AI Analysis:</b></p>" +

            "<p>" +
            (result.analysis || "No analysis returned.") +
            "</p>";

    }
    catch(error){

        console.error(error);

        document.getElementById("results").innerHTML =

            "<h3 class='error'>Unable to submit survey</h3>" +

            "<p>The request never reached Apps Script or Apps Script rejected the request.</p>" +

            "<pre>" +
            error +
            "</pre>";

    }

});


document.getElementById("analysisBtn").addEventListener("click", async function(){

    try{

        const response =
            await fetch(
                WEB_APP_URL + "?action=analysis"
            );

        const text =
            await response.text();

        const data =
            JSON.parse(text);

        document.getElementById("analysisResults").style.display = "block";

        document.getElementById("analysisResults").innerHTML =

            "<h2>Survey Analysis</h2>" +

            "<p><b>Total Responses:</b> "
            + data.totalResponses +
            "</p>" +

            "<p><b>Most Popular Season:</b> "
            + data.favoriteSeason +
            "</p>" +

            "<p><b>Average Temperature:</b> "
            + data.averageTemperature +
            "°F</p>";

    }
    catch(error){

        document.getElementById("analysisResults").style.display = "block";

        document.getElementById("analysisResults").innerHTML =

            "<h3 class='error'>Analysis Error</h3>" +

            "<pre>" +
            error +
            "</pre>";

    }

});

</script>

</body>
</html>
