<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vacation Survey</title>

<style>
body{
    font-family:Arial, sans-serif;
    background:#f4f4f4;
    max-width:800px;
    margin:40px auto;
    padding:20px;
}

.container{
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.15);
}

h1,h2{
    text-align:center;
}

.question{
    margin-bottom:25px;
}

textarea{
    width:100%;
}

button{
    background:#0078D7;
    color:white;
    border:none;
    padding:12px 20px;
    margin-right:10px;
    border-radius:5px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#005ea6;
}

#results,
#analysisResults{
    margin-top:20px;
    padding:15px;
    border-radius:5px;
    display:none;
}

#results{
    background:#e8f4ff;
}

#analysisResults{
    background:#f0fff0;
}
</style>

</head>
<body>

<div class="container">

<h1>Vacation Survey</h1>

<form id="surveyForm">

<div class="question">
<h3>1. Which season is your favorite?</h3>

<label>
<input type="radio" name="season" value="Spring" required>
Spring
</label><br>

<label>
<input type="radio" name="season" value="Summer">
Summer
</label><br>

<label>
<input type="radio" name="season" value="Fall">
Fall
</label><br>

<label>
<input type="radio" name="season" value="Winter">
Winter
</label>

</div>

<div class="question">
<h3>2. What is your favorite temperature (°F)?</h3>
<input type="number" id="temperature" required>
</div>

<div class="question">
<h3>3. What is your favorite activity to do on vacation?</h3>

<textarea
id="activity"
rows="5"
required></textarea>

</div>

<button type="submit">
Submit Survey
</button>

<button type="button" id="analysisBtn">
View Survey Analysis
</button>

</form>

<div id="results"></div>

<div id="analysisResults"></div>

</div>

<script>

const WEB_APP_URL =
"https://script.google.com/macros/s/AKfycbzEd2fQP7owvJAB8ulOAhiGhlmYWd5ILbihc0_yEbkWKcHoIFoJaGXlIOKXXQ4B8X3e/exec";

document.getElementById("surveyForm").addEventListener("submit", async function(event){

    event.preventDefault();

    const season =
        document.querySelector('input[name="season"]:checked').value;

    const temperature =
        document.getElementById("temperature").value;

    const activity =
        document.getElementById("activity").value;

    try{

        const response = await fetch(WEB_APP_URL,{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                season:season,
                temperature:temperature,
                activity:activity
            })
        });

        const result = await response.json();

        document.getElementById("results").style.display = "block";

        document.getElementById("results").innerHTML =
            "<h2>Survey Submitted!</h2>" +
            "<p><strong>Season:</strong> " + season + "</p>" +
            "<p><strong>Favorite Temperature:</strong> " + temperature + "°F</p>" +
            "<p><strong>Vacation Activity:</strong> " + activity + "</p>" +
            "<hr>" +
            "<p><strong>AI Analysis:</strong></p>" +
            "<p>" + result.analysis + "</p>";

    }
    catch(error){

        document.getElementById("results").style.display = "block";

        document.getElementById("results").innerHTML =
            "<p style='color:red;'>Unable to submit survey.</p>";

        console.error(error);
    }

});

document.getElementById("analysisBtn").addEventListener("click", async function(){

    try{

        const response =
            await fetch(WEB_APP_URL + "?action=analysis");

        const data =
            await response.json();

        document.getElementById("analysisResults").style.display = "block";

        document.getElementById("analysisResults").innerHTML =

        "<h2>Survey Analysis</h2>" +

        "<p><strong>Total Responses:</strong> " +
        data.totalResponses +
        "</p>" +

        "<p><strong>Most Popular Season:</strong> " +
        data.favoriteSeason +
        "</p>" +

        "<p><strong>Average Temperature:</strong> " +
        data.averageTemperature +
        "°F</p>" +

        "<h3>Vacation Activity Themes</h3>" +

        "<ul>" +

        data.activityThemes.map(function(item){
            return "<li>" + item + "</li>";
        }).join("") +

        "</ul>";

    }
    catch(error){

        document.getElementById("analysisResults").style.display = "block";

        document.getElementById("analysisResults").innerHTML =
            "<p style='color:red;'>Unable to load survey analysis.</p>";

        console.error(error);
    }

});

</script>

</body>
</html>
